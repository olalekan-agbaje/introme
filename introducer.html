:root{
  --paper:#EEF2F0; --surface:#FFFFFF; --ink:#1F3A5F; --text:#1E2A28; --muted:#5A6B66;
  --line:#C9D3CF; --mark:#E2A400; --mark-ink:#2E2200; --warn:#A33A1F; --tipbg:#FFF6DC; --focus:#2F6FD0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141B1A; --surface:#1C2524; --ink:#A9C4E8; --text:#E3EAE7; --muted:#9AAAA5;
    --line:#2E3B39; --mark:#F0B92A; --mark-ink:#241A00; --warn:#F08A6C; --tipbg:#2A2615; --focus:#7FB0FF;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);
  font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:44rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-weight:700;
  color:var(--ink);font-size:clamp(2.1rem,7vw,3rem);line-height:1.05;margin:0 0 .4rem;letter-spacing:-.01em}
.me{font-family:"Ephesis","Snell Roundhand","Apple Chancery",cursive;font-weight:400;font-size:1.35em;line-height:.8;margin-left:.04em;letter-spacing:0}
.lede{color:var(--muted);margin:0 0 1.75rem;max-width:36rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem}
label.f{display:block;font-weight:600;margin:0 0 .35rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--paper);
  border:1.5px solid var(--line);border-radius:6px;padding:.6rem .75rem}
input[type=text]{max-width:22rem;margin-bottom:1rem}
textarea{min-height:13rem;resize:vertical;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.below{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:.4rem 0 1rem}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.counter.near{color:var(--ink);font-weight:600}
.counter.over{color:var(--warn);font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:.9rem}
.check{display:flex;gap:.6rem;align-items:center;margin:0 0 1.25rem;cursor:pointer}
.check input{width:1.15rem;height:1.15rem;accent-color:var(--ink)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap}
button.primary,button.secondary{font:inherit;font-weight:600;border-radius:6px;padding:.65rem 1.2rem;cursor:pointer;border:1.5px solid var(--ink)}
button.primary{background:var(--ink);color:var(--surface)}
button.secondary{background:transparent;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}

#out{margin-top:2.25rem}
#out[hidden]{display:none}
.out-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.out-head h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--ink);margin:0;font-size:1.6rem}
.hints{list-style:none;margin:0 0 1.25rem;padding:0}
.hints li{background:var(--tipbg);border-left:4px solid var(--mark);padding:.6rem .85rem;margin:0 0 .5rem;border-radius:0 6px 6px 0;font-size:.95rem}
.hints li.warn{border-left-color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:8px;padding:1rem 1.15rem 1.1rem;margin:0 0 1rem}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.5rem}
.tone{font-size:.85rem;color:var(--muted);font-weight:600}
.card p{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.12rem;line-height:1.6}
.copy{font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:6px;padding:.3rem .8rem;cursor:pointer;min-width:6.5rem}
.copy.done{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}

details{margin-top:1.5rem;color:var(--muted);font-size:.92rem}
summary{cursor:pointer;color:var(--ink);font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem;margin:.75rem 0 0}
dt{font-weight:600;color:var(--text)}
dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){ .panel{padding:1rem} .card-top{flex-wrap:wrap} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Introduce<span class="me">Me</span></h1>
  <p class="lede">Paste a few lines about yourself: your role, what you're good at, something you achieved and what changed because of it. You'll get short introductions you can copy and use anywhere.</p>

  <section class="panel" aria-label="Your details">
    <label class="f" for="name">Your name <small>(optional)</small></label>
    <input type="text" id="name" autocomplete="name" placeholder="e.g. Maria Lopez">

    <label class="f" for="bio">About you</label>
    <textarea id="bio" placeholder="e.g. I'm a product manager with 8 years of experience. I'm skilled in user research and roadmapping. I led the redesign of our onboarding flow, which reduced churn by 18%. I'm looking for a product leadership role."></textarea>
    <div class="below">
      <span class="counter" id="counter" aria-live="polite">0 / 500 words</span>
      <button type="button" class="linkbtn" id="example">Fill in an example</button>

    <label class="check"><input type="checkbox" id="goal" checked> Include what I'm looking for</label>

    <div class="actions">
      <button type="button" class="primary" id="gen" disabled>Write introductions</button>
    </div>
  </section>

  <section id="out" hidden aria-labelledby="out-title">

</div>

  /* ---------- Person normalisation (third -> first) ---------- */

  /* ---------- Extraction ---------- */
  function cleanRole(raw) {

  function findRole(sentences) {

  function findYears(text) {

  function findStrengths(sentences) {

  function findAchievements(sentences, goalIdx) {

  /* ---------- Composition ---------- */
  const TONES = ["Concise", "Warm", "Confident", "Formal"];

  const many = d => d.strengths.length > 1;
  function roleBit(d) { if (!d.role) return null; return `${article(d.role)} ${d.role}${d.org ? ` at ${d.org}` : ""}`; }

    ],
    Confident: [
      d => !d.role && d.goTo && (d.name ? `I'm ${d.name}, and I'm ${d.goTo}.` : `I'm ${d.goTo}.`),
      d => d.name && d.role && `I'm ${d.name}, ${roleBit(d)} who gets results.`,
      d => !d.name && d.role && `I'm ${roleBit(d)} who gets results.`,
      d => d.name && d.role && d.years && `I'm ${d.name}, ${roleBit(d)} with ${d.years} of hands-on experience.`,
      d => d.name && !d.role && !d.field && `I'm ${d.name}, and I focus on results.`,
      d => !d.role && d.field && (d.name ? `I'm ${d.name}, and I work in ${d.field}.` : `I work in ${d.field}, and I focus on results.`),
      d => !d.name && !d.role && `I focus on work that produces results.`
    ],
    Formal: [
      d => !d.role && d.goTo && (d.name ? `My name is ${d.name}, and I am ${d.goTo}.` : `I am ${d.goTo}.`),
      d => d.name && d.role && `My name is ${d.name}, and I am ${roleBit(d)}.`,
      d => d.name && d.role && `Allow me to introduce myself: I am ${d.name}, ${roleBit(d)}.`,
      d => !d.name && d.role && `I am ${roleBit(d)}.`,
      d => d.name && !d.role && !d.field && `My name is ${d.name}.`,
      d => !d.role && d.field && (d.name ? `My name is ${d.name}, and I work in ${d.field}.` : `I work in the field of ${d.field}.`),
      d => !d.name && !d.role && `Allow me to introduce myself.`
    ]
  };

  const STRENGTH = {
    Concise: [
      d => `My ${many(d) ? "strengths are" : "strength is"} ${joinList(d.strengths)}.`,
      d => `I specialize in ${joinList(d.strengths)}.`,
      d => d.years && `I have ${d.years} of experience in ${joinList(d.strengths)}.`
    ],
    Warm: [
      d => `I love working on ${joinList(d.strengths)}.`,
      d => `I'm at my best when it comes to ${joinList(d.strengths)}.`,
      d => `People tend to come to me for ${joinList(d.strengths)}.`
    ],
    Confident: [
      d => `My core ${many(d) ? "strengths are" : "strength is"} ${joinList(d.strengths)}.`,
      d => d.years && `I bring ${d.years} of experience in ${joinList(d.strengths)}.`,
      d => `I'm strongest in ${joinList(d.strengths)}.`
    ],
    Formal: [
      d => `My principal ${many(d) ? "areas of strength are" : "area of strength is"} ${joinList(d.strengths)}.`,
      d => d.years && `I bring ${d.years} of professional experience in ${joinList(d.strengths)}.`,
      d => `My expertise lies in ${joinList(d.strengths)}.`
    ]
  };

  const joinOutcome = a => a.outcome ? `${a.action}${/^that\b/i.test(a.outcome) ? " " : ", "}${a.outcome}` : a.action;
  function actSentence(a, frame) {
    const subj = a.subject;
    const body = `${subj} ${joinOutcome(a)}`;
    return frame(body, a);
  }
  const ACHIEVE = {
    Concise: [ (b) => `${cap(b)}.`, (b, a) => a.ctx ? `${a.ctx}, ${b}.` : `${cap(b)}.` ],
    Warm: [ (b) => `One thing I'm proud of: ${b}.`, (b) => `A highlight for me was when ${b}.`, (b, a) => a.ctx ? `${a.ctx}, ${b}, and I'm really proud of that.` : `I'm especially proud that ${b}.` ],
    Confident: [ (b) => `For example, ${b}.`, (b, a) => a.ctx ? `${a.ctx}, ${b}.` : `Case in point: ${b}.`, (b) => `${cap(b)}.` ],
    Formal: [ (b, a) => a.ctx ? `${a.ctx}, ${b}.` : `Notably, ${b}.`, (b) => `Among my accomplishments, ${b}.`, (b) => `In one notable project, ${b}.` ]
  };
  const ACHIEVE2 = {
    Concise: [ b => `I also ${b}.` ],
    Warm: [ b => `I also ${b}.`, b => `Another one I enjoyed: I ${b}.` ],
    Confident: [ b => `I also ${b}.`, b => `On top of that, I ${b}.` ],
    Formal: [ b => `In addition, I ${b}.`, b => `Additionally, I ${b}.` ]
  };
  // "So what?" bridge: only used when the outcome is stated, to make the impact explicit without inventing facts.
  const SOWHAT = {
    Concise: [ "That's the kind of measurable impact I aim for.", "I focus on outcomes, not just output." ],
    Warm: [ "Seeing that kind of real-world difference is what keeps me motivated.", "Making a tangible difference is what I enjoy most about my work." ],
    Confident: [ "I deliver results that show up in the numbers.", "That's the kind of impact I bring to every team." ],
    Formal: [ "I consistently aim for outcomes that can be measured.", "This reflects my focus on delivering tangible results." ]
  };
  const GOAL = {
    noun: {
      Concise: [ g => `I'm now looking for ${g}.` ],
      Warm: [ g => `Next, I'd love to find ${g}.`, g => `I'm now looking for ${g}, and I'd love to connect.` ],
      Confident: [ g => `I'm now seeking ${g}.`, g => `Next, I'm targeting ${g}.` ],
      Formal: [ g => `I am currently seeking ${g}.`, g => `I would welcome a conversation about ${g}.` ]
    },
    gerund: {
      Concise: [ g => `I'm now interested in ${g}.`, g => `Next, I'm focused on ${g}.` ],
      Warm: [ g => `Next, I'm really excited about ${g}.`, g => `I'd love to talk with anyone about ${g}.` ],
      Confident: [ g => `Next, I'm focused on ${g}.`, g => `I'm ready to take on ${g}.` ],
      Formal: [ g => `I am now interested in ${g}.`, g => `I would welcome a conversation about ${g}.` ]
    },
    verb: {
      Concise: [ g => `Next, I want to ${g}.` ],
      Warm: [ g => `Next, I'd love to ${g}.`, g => `I'm hoping to ${g}, and I'd love to connect.` ],
      Confident: [ g => `My next goal is to ${g}.`, g => `I'm ready to ${g}.` ],
      Formal: [ g => `I am now looking to ${g}.`, g => `My objective is to ${g}.` ]
    }
  };

  function tidy(s) {
    return s.replace(/\s+/g, " ").replace(/\s+([,.!?;:])/g, "$1").replace(/([.!?])\.+/g, "$1").replace(/,\s*,/g, ",")
      .replace(/\b(a|an) ([A-Za-z][\w-]*)/g, (m, a, w) => (a.toLowerCase() === "a" || a.toLowerCase() === "an") ? (a[0] === "A" ? cap(article(w)) : article(w)) + " " + w : m)
      .replace(/\bi\b/g, "I").trim();
  }

  function options(fnList, d) { return fnList.map((f, i) => ({ i, v: f(d) })).filter(x => x.v); }

  function composeOne(d, tone, r, includeGoal) {
    const parts = [];
    let opens = options(OPEN[tone], d);
    if (!d.role && d.goTo) { const g = opens.filter(o => o.v.includes(d.goTo)); if (g.length) opens = g; }
    const op = opens.length ? pick(r, opens) : { i: 0, v: d.name ? `I'm ${d.name}.` : "Allow me to introduce myself." };
    parts.push({ k: "open", t: op.v });
    let key = `${tone}|o${op.i}`;

    if (d.strengths.length) {
      const ds = d.years && op.v.includes(d.years) ? { ...d, years: null } : d;
      const st = pick(r, options(STRENGTH[tone], ds));
      parts.push({ k: "strength", t: st.v });
      key += `|s${st.i}`;
    }
    const a1 = d.achievements[0];
    if (a1) {
      const fi = Math.floor(r() * ACHIEVE[tone].length);
      parts.push({ k: "achieve", t: actSentence(a1, ACHIEVE[tone][fi]) });
      key += `|a${fi}`;
    }
    const extras = [];
    const a2 = d.achievements[1];
    if (a2 && a2.score >= 4) {
      const fi = Math.floor(r() * ACHIEVE2[tone].length);
      extras.push({ k: "achieve2", t: ACHIEVE2[tone][fi](joinOutcome(a2)), key: `|b${fi}` });
    }
    if (a1 && (a1.outcome || a1.hasMetric)) {
      const si = Math.floor(r() * SOWHAT[tone].length);
      extras.push({ k: "sowhat", t: SOWHAT[tone][si], key: `|w${si}` });
    }
    let goalPart = null;
    if (includeGoal && d.goal) {
      const list = GOAL[d.goal.type][tone];
      const gi = Math.floor(r() * list.length);
      goalPart = { k: "goal", t: list[gi](d.goal.text) };
      key += `|g${gi}`;
    }
    // fill to 4–5 sentences
    const target = r() < 0.5 ? 4 : 5;
    let count = parts.length + (goalPart ? 1 : 0);
    const order = r() < 0.5 ? extras : extras.slice().reverse();
    for (const e of order) { if (count >= target) break; if (count < 5) { parts.push(e); key += e.key; count++; } }
    if (goalPart) parts.push(goalPart);
    const text = parts.map(p => tidy(p.t)).join(" ");
    return { text, key, tone, sentences: parts.length };
  }

  function compose(d, opts) {
    const { includeGoal = true, seed = Date.now(), seen = new Set() } = opts || {};
    const r = rng(seed);
    const rich = d.achievements.length && d.strengths.length && (d.role || d.name) && (d.achievements.length > 1 || d.achievements[0].outcome || d.goal);
    const n = rich ? 4 : 3;
    const tones = TONES.slice();
    // rotate tones so 3-card sets vary which tone is left out
    const start = Math.floor(r() * 4);
    const ordered = tones.slice(start).concat(tones.slice(0, start)).slice(0, n);
    const out = [];
    ordered.forEach(tone => {
      let best = null;
      for (let tries = 0; tries < 25; tries++) {
        const c = composeOne(d, tone, r, includeGoal);
        if (!seen.has(c.key) && !seen.has("T:" + c.text) && !out.some(o => o.text === c.text)) { best = c; break; }
        if (!best) best = c;
      }
      seen.add(best.key); seen.add("T:" + best.text);
      out.push(best);
    });
    return out;
  }

  function hints(d, includeGoal, results) {
    const h = [];
    if (results && results.some(x => x.sentences < 4) && d.achievements.length) h.push({ level: "tip", text: "Some introductions are under 4 sentences because there isn't enough detail yet. Add a strength, a second achievement or a result to fill them out." });
    if (!d.achievements.length) h.push({ level: "warn", text: "I couldn't find an achievement. Add a sentence that starts with what you did, like \"I led…\", \"I built…\" or \"I reduced…\"." });
    else if (!d.achievements[0].outcome && !d.achievements[0].hasMetric) h.push({ level: "tip", text: "Add a result: what changed because of your work? A number (%, $, time saved, people helped) makes the \"so what?\" much stronger." });
    if (!d.role) h.push({ level: "tip", text: "Mention your role, like \"I'm a project manager\", for a stronger opening line." });
    if (!d.strengths.length) h.push({ level: "tip", text: "Name a strength or two, like \"I'm skilled in negotiation and budgeting\"." });
    if (includeGoal && !d.goal) h.push({ level: "tip", text: "The \"what I'm looking for\" sentence was left out because I couldn't find one. Try \"I'm looking for…\", \"I want to work as…\" or \"I need a role where…\"." });
    if (d.fixes && d.fixes.length) h.push({ level: "tip", text: `I fixed some likely typos before writing: ${d.fixes.slice(0, 6).map(f => `\"${f[0]}\" to \"${f[1]}\"`).join(", ")}. Check they're right.` });
    return h;
  }

  return { extract, compose, hints, countWords, splitSentences };
})();
if (typeof module !== "undefined") module.exports = Engine;

</script>
<script>
(() => {
  const LIMIT = 500;
  const $ = id => document.getElementById(id);
  const nameEl = $("name"), bioEl = $("bio"), goalEl = $("goal"), genBtn = $("gen"), counter = $("counter");
  let data = null, seen = new Set(), current = [];

  const EXAMPLE = `I'm a senior product manager at Brightwave with 8 years of experience. I'm skilled in user research, roadmapping and stakeholder management. Last year I led the redesign of our onboarding flow, which reduced customer churn by 18% in two quarters. I also launched a self-serve billing portal that cut support tickets by 30%. I'm looking for a product leadership role at a mission-driven company.`;

  function updateCount() {
    const n = Engine.countWords(bioEl.value);
    counter.textContent = `${n} / ${LIMIT} words${n > LIMIT ? ` (remove ${n - LIMIT})` : ""}`;
    counter.className = "counter" + (n > LIMIT ? " over" : n >= LIMIT - 50 ? " near" : "");
    genBtn.disabled = n === 0 || n > LIMIT;
  }
  bioEl.addEventListener("input", updateCount);
  $("example").addEventListener("click", () => { bioEl.value = EXAMPLE; if (!nameEl.value) nameEl.value = "Maria Lopez"; updateCount(); bioEl.focus(); });

  function render(results) {
    current = results;
    const hints = Engine.hints(data, goalEl.checked, results);
    $("hints").innerHTML = "";
    hints.forEach(h => { const li = document.createElement("li"); li.className = h.level; li.textContent = h.text; $("hints").appendChild(li); });
    const cards = $("cards"); cards.innerHTML = "";
    results.forEach((r, i) => {
      const art = document.createElement("article"); art.className = "card";
      art.innerHTML = `<div class="card-top"><span class="tone">${r.tone}</span><button type="button" class="copy" aria-label="Copy ${r.tone} introduction">Copy</button></div><p></p>`;
      art.querySelector("p").textContent = r.text;
      art.querySelector(".copy").addEventListener("click", e => copy(r.text, e.currentTarget, "Copied"));
      cards.appendChild(art);
    });
    const fl = $("foundlist"); fl.innerHTML = "";
    const row = (k, v) => { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v || "Not found"; fl.append(dt, dd); };
    row("Role", data.role ? data.role + (data.org ? ` at ${data.org}` : "") : data.field ? `Works in ${data.field}` : "");
    row("Experience", data.years);
    row("Strengths", data.strengths.join(", "));
    const a = data.achievements[0];
    row("Achievement", a ? a.action : "");
    row("Result", a ? (a.outcome || (a.hasMetric ? "Included in the achievement" : "")) : "");
    row("Looking for", data.goal ? data.goal.text : "");
    $("out").hidden = false;
  }

  function generate(fresh) {
    if (fresh) { data = Engine.extract(bioEl.value, nameEl.value); seen = new Set(); }
    const res = Engine.compose(data, { includeGoal: goalEl.checked, seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, seen });
    render(res);
    $("status").textContent = `${res.length} introductions ready.`;
  }
  genBtn.addEventListener("click", () => { generate(true); $("out").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
  $("regen").addEventListener("click", () => generate(false));
  // Changing the checkbox or name after generating refreshes the set
  goalEl.addEventListener("change", () => { if (data) generate(false); });
  nameEl.addEventListener("change", () => { if (data) generate(true); });

  async function copy(text, btn, label) {
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
    }
    const old = btn.dataset.label || btn.textContent; btn.dataset.label = old;
    btn.textContent = ok ? `${label} ✓` : "Select and copy manually";
    btn.classList.toggle("done", ok);
    $("status").textContent = ok ? "Copied to clipboard." : "Copy failed. Select the text and copy it manually.";
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1800);
  }
  $("copyall").addEventListener("click", e => copy(current.map(r => r.text).join("\n\n"), e.currentTarget, "Copied all"));

  updateCount();
})();
</script>
</body>
